<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reflection</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 16px;
      padding: 32px 36px;
      width: 340px;
      text-align: center;
    }

    .icon { font-size: 36px; margin-bottom: 16px; }

    h1 {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }

    .meta {
      font-size: 12px;
      color: #555;
      margin-bottom: 14px;
    }

    .meta span { font-family: monospace; color: #888; }

    .reason-box {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #bbb;
      font-style: italic;
      margin-bottom: 20px;
      text-align: left;
      line-height: 1.5;
    }

    .question {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-yes {
      background: #1a2e1a;
      border-color: #2d5a2d;
      color: #5cb85c;
    }

    .btn-yes:hover { background: #223a22; border-color: #4caf50; }

    .btn-no {
      background: #2e1a1a;
      border-color: #5a2d2d;
      color: #e05252;
    }

    .btn-no:hover { background: #3a2222; border-color: #c0392b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🤔</div>
    <h1>Did you stick to your reason?</h1>
    <p class="meta"><span id="domain"></span> · <span id="time"></span></p>
    <div class="reason-box" id="reason"></div>
    <p class="question">Did you actually use this time for what you said?</p>
    <div class="buttons">
      <button class="btn-yes" id="btn-yes">Yes, I did</button>
      <button class="btn-no"  id="btn-no">No, I drifted</button>
    </div>
  </div>
  <script src="reflect.js"></script>
</body>
</html>

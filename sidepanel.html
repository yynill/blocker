<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>A Peace of Mind</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid #222;
    }

    .title { font-size: 15px; font-weight: 600; color: #fff; }

    .incognito-warning {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 12px 18px 0;
      padding: 10px 12px;
      border: 1px solid #5a4a2d;
      background: #2e261a;
      color: #e0a552;
      font-size: 12px;
      border-radius: 8px;
    }

    .incognito-warning.visible { display: flex; }

    .incognito-warning button {
      padding: 5px 10px;
      font-size: 11px;
      flex-shrink: 0;
      border-color: #5a4a2d;
      color: #e0a552;
      background: transparent;
    }

    .incognito-warning button:hover { background: #3a301f; color: #fff; }

    .toggle-row {
      padding: 12px 18px 0;
    }

    .break-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #2d5a2d;
      background: #1a2e1a;
      color: #5cb85c;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .break-btn:hover { background: #223a22; }

    .break-btn.paused {
      border-color: #5a4a2d;
      background: #2e261a;
      color: #e0a552;
      cursor: default;
    }

    .break-btn.paused:hover { background: #2e261a; }

    .list-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 4px;
    }

    .list-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    button {
      padding: 8px 14px;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      background: #1a1a1a;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    button:hover { background: #252525; color: #fff; }

    .clear-btn {
      padding: 3px 9px;
      font-size: 11px;
    }

    .history-list {
      overflow-y: auto;
      padding: 6px 0;
      flex: 1;
    }

    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .empty {
      text-align: center;
      color: #555;
      font-size: 13px;
      padding: 30px 0;
    }

    .history-row {
      padding: 8px 18px;
      border-bottom: 1px solid #1a1a1a;
    }

    .history-domain {
      font-size: 13px;
      font-family: monospace;
      color: #ccc;
    }

    .history-time {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    .history-url {
      font-size: 11px;
      font-family: monospace;
      color: #555;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .history-url:hover { color: #999; }

  </style>
</head>
<body>
  <header>
    <span class="title">A Peace of Mind</span>
  </header>

  <div class="incognito-warning" id="incognito-warning">
    <span>⚠️ Not active in Incognito — sites are unblocked there.</span>
    <button id="fix-incognito-btn">Fix</button>
  </div>

  <div class="toggle-row">
    <button id="break-btn" class="break-btn">☕ 10 min free</button>
  </div>

  <div class="list-label-row">
    <span class="list-label">History</span>
    <button class="clear-btn" id="clear-history-btn">Clear</button>
  </div>

  <div class="history-list" id="history-list">
    <div class="empty">Nothing blocked yet.</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>

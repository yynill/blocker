<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>A Peace of Mind</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid #222;
    }

    .title { font-size: 15px; font-weight: 600; color: #fff; }

    .incognito-warning {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 12px 18px 0;
      padding: 10px 12px;
      border: 1px solid #5a4a2d;
      background: #2e261a;
      color: #e0a552;
      font-size: 12px;
      border-radius: 8px;
    }

    .incognito-warning.visible { display: flex; }

    .incognito-warning button {
      padding: 5px 10px;
      font-size: 11px;
      flex-shrink: 0;
      border-color: #5a4a2d;
      color: #e0a552;
      background: transparent;
    }

    .incognito-warning button:hover { background: #3a301f; color: #fff; }

    .toggle-row {
      padding: 12px 18px 0;
    }

    .unlock-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #2d5a2d;
      background: #1a2e1a;
      color: #5cb85c;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .unlock-btn:hover { background: #223a22; }

    .unlock-btn:disabled { cursor: default; }

    .unlock-btn.unlocked {
      border-color: #5a4a2d;
      background: #2e261a;
      color: #e0a552;
    }

    .unlock-btn.unlocked:hover { background: #2e261a; }

    .relock-btn {
      display: none;
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      font-size: 13px;
      border-color: #5a2d2d;
      color: #d9534f;
    }

    .relock-btn.visible { display: block; }

    .relock-btn:hover { background: #2e1a1a; color: #ff6b63; }

    .wait-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      background: #161616;
    }

    .wait-panel.visible { display: flex; }

    .wait-label {
      text-align: center;
      font-size: 12px;
      color: #888;
    }

    .progress-track {
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #5cb85c;
      transition: width 0.1s linear;
    }

    .code-panel {
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      background: #161616;
    }

    .code-panel.visible { display: flex; }

    .code-display {
      text-align: center;
      font-family: monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #fff;
      padding: 6px 0;
    }

    .code-timer {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: -6px;
    }

    .code-input {
      width: 100%;
      padding: 10px 12px;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 14px;
      font-family: monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .code-input:focus { outline: none; border-color: #555; }

    .code-error {
      font-size: 12px;
      color: #d9534f;
      text-align: center;
      min-height: 14px;
    }

    .code-actions {
      display: flex;
      gap: 8px;
    }

    .code-actions button {
      flex: 1;
    }

    .code-confirm-btn {
      border-color: #2d5a2d;
      background: #1a2e1a;
      color: #5cb85c;
    }

    .code-confirm-btn:hover { background: #223a22; color: #fff; }

    .list-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 4px;
    }

    .list-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    button {
      padding: 8px 14px;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      background: #1a1a1a;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    button:hover { background: #252525; color: #fff; }

    .clear-btn {
      padding: 3px 9px;
      font-size: 11px;
    }

    .history-list {
      overflow-y: auto;
      padding: 6px 0;
      flex: 1;
    }

    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .empty {
      text-align: center;
      color: #555;
      font-size: 13px;
      padding: 30px 0;
    }

    .history-row {
      padding: 8px 18px;
      border-bottom: 1px solid #1a1a1a;
    }

    .history-domain {
      font-size: 13px;
      font-family: monospace;
      color: #ccc;
    }

    .history-time {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    .history-url {
      font-size: 11px;
      font-family: monospace;
      color: #555;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .history-url:hover { color: #999; }

  </style>
</head>
<body>
  <header>
    <span class="title">A Peace of Mind</span>
  </header>

  <div class="incognito-warning" id="incognito-warning">
    <span>⚠️ Not active in Incognito — sites are unblocked there.</span>
    <button id="fix-incognito-btn">Fix</button>
  </div>

  <div class="toggle-row">
    <button id="unlock-btn" class="unlock-btn">🔓 Unlock everything (1h)</button>
    <button id="relock-btn" class="relock-btn">🔒 Lock again now</button>
    <div class="wait-panel" id="wait-panel">
      <div class="wait-label" id="wait-label">Hold on… 60s</div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <button id="wait-cancel-btn">Cancel</button>
    </div>
    <div class="code-panel" id="code-panel">
      <div class="code-display" id="code-display"></div>
      <div class="code-timer" id="code-timer"></div>
      <input type="text" id="code-input" class="code-input" placeholder="Type the code above" autocomplete="off" spellcheck="false" maxlength="8" />
      <div class="code-error" id="code-error"></div>
      <div class="code-actions">
        <button id="code-cancel-btn">Cancel</button>
        <button id="code-confirm-btn" class="code-confirm-btn">Confirm</button>
      </div>
    </div>
  </div>

  <div class="list-label-row">
    <span class="list-label">History</span>
    <button class="clear-btn" id="clear-history-btn">Clear</button>
  </div>

  <div class="history-list" id="history-list">
    <div class="empty">Nothing blocked yet.</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>

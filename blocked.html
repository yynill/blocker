<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Blocked</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 16px;
      padding: 40px 48px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }

    .domain {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
      font-family: monospace;
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 14px;
      font-family: inherit;
      padding: 12px;
      resize: vertical;
      min-height: 90px;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus {
      border-color: #555;
    }

    textarea::placeholder { color: #555; }

    .error {
      color: #e05252;
      font-size: 12px;
      text-align: left;
      margin-top: 6px;
      min-height: 16px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #0f0f0f;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #ddd; }
    button:active { background: #bbb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚫</div>
    <h1>This site is blocked</h1>
    <p class="domain" id="domain-name"></p>

    <label for="reason">Why do you need to visit this site?</label>
    <textarea id="reason" placeholder="Enter your reason…" autofocus></textarea>
    <div class="error" id="error-msg"></div>

    <button id="proceed-btn">Proceed</button>
  </div>

  <script src="blocked.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Blocked</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #e8e8e8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        .wrap {
            max-width: 100%;
            width: 96%;
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: clamp(36px, 7vw, 108px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #fff;
            margin: 0 auto 32px;
            text-align: center;
        }

        .blocked-image {
            display: none;
            max-width: 100%;
            max-height: 38vh;
            border-radius: 0;
            margin: 0 auto 32px;
        }

        .blocked-image.visible {
            display: block;
        }

        .domain {
            font-size: 13px;
            color: #4a4a4a;
            font-family: monospace;
            letter-spacing: 0.02em;
            margin-bottom: 32px;
        }

        .saved-url-row {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            max-width: 100%;
            margin-bottom: 24px;
        }

        .saved-url-row.visible {
            display: flex;
        }

        .saved-url {
            font-size: 12px;
            font-family: monospace;
            color: #777;
            max-width: 60vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        button {
            padding: 12px 24px;
            background: transparent;
            color: #666;
            font-size: 13px;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }

        button:hover {
            color: #ccc;
            border-color: #555;
        }

        .copy-btn {
            padding: 4px 10px;
            font-size: 11px;
            flex-shrink: 0;
        }

        .copy-btn.copied {
            color: #5cb85c;
            border-color: #2d5a2d;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <img class="blocked-image" id="blocked-image" alt="" />
        <h1 id="headline">You will die.</h1>
        <p class="domain" id="domain-name"></p>
        <div class="saved-url-row" id="saved-url-row">
            <span class="saved-url" id="saved-url"></span>
            <button class="copy-btn" id="copy-btn">Copy link</button>
        </div>
        <button id="close-btn">Close this tab</button>
    </div>
    <script src="blocked.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Blocked</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            text-align: center;
        }

        .wrap {
            max-width: 100%;
            width: 96%;
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 96px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
            margin: 0 auto 28px;
            text-align: center;
        }

        .blocked-image {
            display: none;
            max-width: 100%;
            max-height: 320px;
            border-radius: 12px;
            margin: 0 auto 32px;
        }

        .blocked-image.visible {
            display: block;
        }

        .question {
            font-size: clamp(24px, 4.5vw, 44px);
            font-weight: 600;
            color: #ddd;
            line-height: 1.35;
            margin-bottom: 36px;
        }

        .domain {
            font-size: 13px;
            color: #555;
            font-family: monospace;
            margin-bottom: 32px;
        }

        button {
            padding: 12px 24px;
            background: transparent;
            color: #666;
            font-size: 13px;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }

        button:hover {
            color: #ccc;
            border-color: #555;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <img class="blocked-image" id="blocked-image" alt="" />
        <h1 id="headline">You will die.</h1>
        <p class="question">Are you sure you want to spend your time like this?</p>
        <p class="domain" id="domain-name"></p>
        <button id="close-btn">Close this tab</button>
    </div>
    <script src="blocked-content.js"></script>
    <script src="blocked.js"></script>
</body>

</html>

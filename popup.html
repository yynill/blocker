<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Site Blocker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      width: 380px;
      min-height: 200px;
      max-height: 560px;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title { font-size: 15px; font-weight: 600; color: #fff; }

    /* ── Stats ── */
    .stats {
      display: flex;
      gap: 16px;
      padding: 12px 18px;
      border-bottom: 1px solid #1e1e1e;
      background: #131313;
    }

    .stat { display: flex; flex-direction: column; gap: 2px; }

    .stat-value { font-size: 18px; font-weight: 700; color: #fff; }

    .stat-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      border-bottom: 1px solid #222;
      background: #0f0f0f;
    }

    .tab {
      flex: 1;
      padding: 9px 0;
      font-size: 12px;
      font-weight: 500;
      color: #555;
      text-align: center;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }

    .tab.active { color: #fff; border-bottom-color: #fff; }

    .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .tab-panel.active { display: flex; }

    /* ── Shared scrollable list ── */
    .scroll-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .scroll-list::-webkit-scrollbar { width: 4px; }
    .scroll-list::-webkit-scrollbar-track { background: transparent; }
    .scroll-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .empty {
      text-align: center;
      color: #555;
      font-size: 13px;
      padding: 40px 0;
    }

    /* ── Session log ── */
    .log-entry {
      padding: 10px 18px;
      border-bottom: 1px solid #1a1a1a;
    }

    .log-entry:last-child { border-bottom: none; }

    .log-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 3px;
    }

    .log-domain { font-size: 13px; font-weight: 600; color: #ccc; font-family: monospace; }
    .log-time { font-size: 11px; color: #555; }
    .log-reason { font-size: 12px; color: #777; line-height: 1.4; margin-bottom: 2px; font-style: italic; }
    .log-date { font-size: 10px; color: #444; }

    /* ── Daily summary ── */
    .day-block {
      padding: 10px 18px 12px;
      border-bottom: 1px solid #1a1a1a;
    }

    .day-block:last-child { border-bottom: none; }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .day-label { font-size: 13px; font-weight: 600; color: #fff; }
    .day-total { font-size: 11px; color: #666; }

    .site-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .site-row:last-child { margin-bottom: 0; }

    .site-name {
      font-size: 12px;
      color: #aaa;
      font-family: monospace;
      width: 130px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-wrap {
      flex: 1;
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }

    .bar { height: 100%; border-radius: 3px; }
    .bar-blocked { background: #c0392b; }
    .bar-normal  { background: #555; }

    .site-time { font-size: 11px; color: #555; width: 48px; text-align: right; flex-shrink: 0; }

    /* ── All-sites view ── */
    .day-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      border-bottom: 1px solid #1e1e1e;
      background: #131313;
      flex-shrink: 0;
    }

    .day-nav-btn {
      background: none;
      border: none;
      color: #666;
      font-size: 16px;
      cursor: pointer;
      padding: 0 6px;
      line-height: 1;
      transition: color 0.15s;
      flex: 0;
    }

    .day-nav-btn:hover { color: #fff; background: none; }
    .day-nav-btn:disabled { color: #333; cursor: default; }

    .day-nav-label { font-size: 13px; font-weight: 500; color: #ccc; }

    .allsites-total {
      font-size: 11px;
      color: #555;
      padding: 6px 18px 2px;
      flex-shrink: 0;
    }

    /* ── Actions ── */
    .actions {
      padding: 10px 18px;
      border-top: 1px solid #222;
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      background: #1a1a1a;
      color: #aaa;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    button:hover { background: #252525; color: #fff; }
    button.danger:hover { background: #2d1414; border-color: #5a2020; color: #e05252; }
  </style>
</head>
<body>
  <header>
    <span class="title">🚫 Site Blocker</span>
  </header>

  <div class="stats">
    <div class="stat">
      <span class="stat-value" id="stat-sessions">—</span>
      <span class="stat-label">Sessions</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-time">—</span>
      <span class="stat-label">Blocked time</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-today">—</span>
      <span class="stat-label">Today online</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="allsites">All Sites</div>
    <div class="tab" data-tab="daily">Daily (Blocked)</div>
    <div class="tab" data-tab="log">Session Log</div>
  </div>

  <!-- All sites tracker -->
  <div class="tab-panel active" id="panel-allsites">
    <div class="day-nav">
      <button class="day-nav-btn" id="day-prev">‹</button>
      <span class="day-nav-label" id="day-nav-label">Today</span>
      <button class="day-nav-btn" id="day-next" disabled>›</button>
    </div>
    <div class="allsites-total" id="allsites-total"></div>
    <div class="scroll-list" id="allsites-list">
      <div class="empty">No browsing data yet.</div>
    </div>
  </div>

  <!-- Daily blocked summary -->
  <div class="tab-panel" id="panel-daily">
    <div class="scroll-list" id="daily-list">
      <div class="empty">No sessions logged yet.</div>
    </div>
  </div>

  <!-- Session log -->
  <div class="tab-panel" id="panel-log">
    <div class="scroll-list" id="log-list">
      <div class="empty">No sessions logged yet.</div>
    </div>
  </div>

  <div class="actions">
    <button id="export-btn">Export CSV</button>
    <button id="clear-btn" class="danger">Clear All</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>

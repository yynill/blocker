<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Site Blocker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      width: 320px;
      max-height: 480px;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid #222;
    }

    .title { font-size: 15px; font-weight: 600; color: #fff; }

    .toggle-row {
      padding: 12px 18px 0;
    }

    .toggle-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #2d5a2d;
      background: #1a2e1a;
      color: #5cb85c;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .toggle-btn:hover { background: #223a22; }

    .toggle-btn.off {
      border-color: #5a2d2d;
      background: #2e1a1a;
      color: #e05252;
    }

    .toggle-btn.off:hover { background: #3a2222; }

    .list-label {
      padding: 14px 18px 4px;
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    button {
      padding: 8px 14px;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      background: #1a1a1a;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    button:hover { background: #252525; color: #fff; }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-track { background: transparent; }
    .list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .empty {
      text-align: center;
      color: #555;
      font-size: 13px;
      padding: 30px 0;
    }

    .site-row {
      padding: 8px 18px;
      font-size: 13px;
      font-family: monospace;
      color: #ccc;
    }

  </style>
</head>
<body>
  <header>
    <span class="title">🚫 Site Blocker</span>
  </header>

  <div class="toggle-row">
    <button id="toggle-btn" class="toggle-btn">Blocker: ON</button>
  </div>

  <div class="list-label">Blocked sites (edit in code)</div>

  <div class="list" id="site-list">
    <div class="empty">No sites blocked yet.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
